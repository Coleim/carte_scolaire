<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Carte scolaire - France</title>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
<style>
  :root {
    --bg: #11141a;
    --panel-bg: rgba(24, 28, 36, 0.92);
    --accent: #3d8bfd;
    --accent-soft: rgba(61, 139, 253, 0.18);
    --text: #f1f3f7;
    --text-dim: #a7adba;
    --border: rgba(255,255,255,0.08);
    --radius: 14px;
    --shadow: 0 8px 28px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  #map { position: absolute; inset: 0; }

  /* ---------- Header ---------- */
  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.7rem 1rem;
    background: linear-gradient(to bottom, rgba(17,20,26,0.92), rgba(17,20,26,0));
    pointer-events: none;
  }
  #header * { pointer-events: auto; }
  #header h1 {
    font-size: 1rem; font-weight: 650; margin: 0; white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .segmented {
    display: flex; background: var(--panel-bg); border-radius: 999px;
    padding: 3px; border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .segmented button {
    appearance: none; border: none; background: transparent; color: var(--text-dim);
    padding: 0.5rem 1rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s ease, color 0.15s ease; min-height: 38px;
    white-space: nowrap;
  }
  .segmented button.active { background: var(--accent); color: #fff; }
  .segmented button:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ---------- Control panel (territory picker) ---------- */
  #controlsPanel {
    position: absolute; z-index: 1000;
    top: 4.2rem; left: 1rem; width: 300px; max-width: calc(100vw - 2rem);
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 1rem; backdrop-filter: blur(10px);
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  #controlsPanel label {
    display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.4rem;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .combobox { position: relative; }
  .combobox input {
    width: 100%; padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05); color: var(--text); font-size: 0.95rem; min-height: 44px;
  }
  .combobox input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .combobox input:disabled { opacity: 0.4; }
  .combobox-list {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    max-height: 260px; overflow-y: auto; background: #1b1f29; border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); display: none; z-index: 1100;
  }
  .combobox-list.open { display: block; }
  .combobox-option {
    padding: 0.6rem 0.8rem; font-size: 0.9rem; cursor: pointer; min-height: 44px;
    display: flex; align-items: center;
  }
  .combobox-option:hover, .combobox-option.highlight { background: var(--accent-soft); }
  .combobox-empty { padding: 0.6rem 0.8rem; font-size: 0.85rem; color: var(--text-dim); }

  #loadStatus {
    margin-top: 0.7rem; font-size: 0.8rem; color: var(--text-dim); min-height: 1.1rem;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .spinner {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Legend ---------- */
  #legend {
    position: absolute; z-index: 1000; bottom: 1rem; left: 1rem; max-width: 280px;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  #legendToggle {
    width: 100%; text-align: left; background: transparent; border: none; color: var(--text);
    font-size: 0.8rem; font-weight: 600; padding: 0.6rem 0.9rem; cursor: pointer; min-height: 40px;
  }
  #legendContent {
    max-height: 220px; overflow-y: auto; padding: 0 0.9rem 0.8rem; font-size: 0.8rem;
    display: none;
  }
  #legend.open #legendContent { display: block; }
  .legend-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0; color: var(--text-dim); }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  #legend:not(.has-items) { display: none; }

  /* ---------- Toast ---------- */
  #toast {
    position: absolute; z-index: 1200; bottom: 1rem; right: 1rem; max-width: 320px;
    background: #3a1f1f; border: 1px solid rgba(255,100,100,0.3); color: #ffdede;
    border-radius: 10px; padding: 0.7rem 0.9rem; font-size: 0.8rem; box-shadow: var(--shadow);
    opacity: 0; transform: translateY(8px); transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  #toast.visible { opacity: 1; transform: translateY(0); }

  /* ---------- Mobile bottom-sheet ---------- */
  #panelToggle { display: none; }

  @media (max-width: 767px) {
    #header { padding: 0.6rem 0.7rem; gap: 0.6rem; }
    #header h1 { display: none; }
    .segmented { flex: 1; justify-content: space-between; }
    .segmented button { flex: 1; padding: 0.5rem 0.4rem; }

    #controlsPanel {
      left: 0; right: 0; width: auto; max-width: none; top: auto; bottom: 0;
      border-radius: 18px 18px 0 0; max-height: 55vh; overflow-y: auto;
      transform: translateY(calc(100% - 3.2rem));
      padding-top: 0.6rem;
    }
    #controlsPanel.expanded { transform: translateY(0); }
    #controlsPanel::before {
      content: ""; display: block; width: 40px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.25); margin: 0 auto 0.8rem;
    }
    #legend { left: 0.6rem; bottom: 0.6rem; max-width: 60vw; }
  }
</style>
</head>
<body>
  <div id="header">
    <h1>Carte scolaire</h1>
    <div class="segmented" id="niveauSwitch">
      <button data-niveau="ecole">Écoles</button>
      <button data-niveau="college">Collèges</button>
      <button data-niveau="lycee">Lycées</button>
    </div>
  </div>

  <div id="map"></div>

  <div id="controlsPanel">
    <label for="territoireInput">Territoire</label>
    <div class="combobox">
      <input id="territoireInput" placeholder="Choisissez un niveau d'abord…" autocomplete="off" disabled />
      <div id="territoireList" class="combobox-list"></div>
    </div>
    <div id="loadStatus"></div>
  </div>

  <div id="legend">
    <button id="legendToggle">Légende</button>
    <div id="legendContent"></div>
  </div>

  <div id="toast"></div>

<script>
const palette = ["#bb69ea","#92ea69","#ea8769","#c669ea","#85ea69","#9bea69","#c1ea69",
  "#eab069","#8369ea","#ea696d","#bfea69","#69eaa6","#ea69c1","#69c1ea","#eae069"];

function colorFor(key) {
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  return palette[hash % palette.length];
}

const map = L.map("map", { center: [46.6, 2.5], zoom: 6, zoomControl: true, preferCanvas: true });
L.control.scale().addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
  minZoom: 0,
  maxZoom: 19,
  attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors. Tiles: <a href=\"https://www.openstreetmap.fr\">OpenStreetMap France</a>",
  subdomains: "abc",
}).addTo(map);

let registry = null;
let currentNiveau = null;
let currentSource = null;
let currentLayer = null;
const cache = {}; // sourceId -> GeoJSON data

const niveauButtons = Array.from(document.querySelectorAll("#niveauSwitch button"));
const territoireInput = document.getElementById("territoireInput");
const territoireList = document.getElementById("territoireList");
const loadStatus = document.getElementById("loadStatus");
const controlsPanel = document.getElementById("controlsPanel");
const legend = document.getElementById("legend");
const legendToggle = document.getElementById("legendToggle");
const legendContent = document.getElementById("legendContent");
const toast = document.getElementById("toast");

let toastTimer = null;
function showToast(message) {
  toast.textContent = message;
  toast.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("visible"), 5000);
}

function setStatus(html) {
  loadStatus.innerHTML = html;
}

function getField(props, fieldName) {
  if (!fieldName) return null;
  return props ? props[fieldName] : null;
}

// ---------- Combobox ----------
let comboOptions = [];
let highlightIndex = -1;

function renderCombobox(filterText) {
  const term = (filterText || "").trim().toLowerCase();
  const filtered = comboOptions.filter(o => o.label.toLowerCase().includes(term));
  territoireList.innerHTML = "";
  highlightIndex = -1;
  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "combobox-empty";
    empty.textContent = "Aucun territoire trouvé.";
    territoireList.appendChild(empty);
  } else {
    filtered.forEach((opt) => {
      const el = document.createElement("div");
      el.className = "combobox-option";
      el.textContent = opt.label;
      el.addEventListener("mousedown", (e) => {
        e.preventDefault();
        selectTerritoire(opt);
      });
      territoireList.appendChild(el);
    });
  }
  territoireList.classList.add("open");
}

function closeCombobox() {
  territoireList.classList.remove("open");
}

territoireInput.addEventListener("input", () => renderCombobox(territoireInput.value));
territoireInput.addEventListener("focus", () => renderCombobox(territoireInput.value));
territoireInput.addEventListener("blur", () => setTimeout(closeCombobox, 120));
territoireInput.addEventListener("keydown", (e) => {
  const options = Array.from(territoireList.querySelectorAll(".combobox-option"));
  if (e.key === "ArrowDown") {
    e.preventDefault();
    highlightIndex = Math.min(highlightIndex + 1, options.length - 1);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    highlightIndex = Math.max(highlightIndex - 1, 0);
  } else if (e.key === "Enter") {
    if (options[highlightIndex]) options[highlightIndex].dispatchEvent(new Event("mousedown"));
    return;
  } else {
    return;
  }
  options.forEach((o, i) => o.classList.toggle("highlight", i === highlightIndex));
  if (options[highlightIndex]) options[highlightIndex].scrollIntoView({ block: "nearest" });
});

function selectTerritoire(opt) {
  territoireInput.value = opt.label;
  closeCombobox();
  loadTerritoire(opt.source);
}

// ---------- Niveau switching ----------
function populateTerritoires(niveau) {
  const sources = registry[niveau] || [];
  comboOptions = sources.map(s => ({ label: s.label, source: s }));
  territoireInput.value = "";
  territoireInput.disabled = sources.length === 0;
  territoireInput.placeholder = sources.length
    ? "Tapez pour chercher un territoire…"
    : "Aucune source disponible";
  clearMap();
  setStatus("");
}

function selectNiveau(niveau) {
  currentNiveau = niveau;
  niveauButtons.forEach(b => b.classList.toggle("active", b.dataset.niveau === niveau));
  populateTerritoires(niveau);
}

niveauButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    if (!btn.disabled) selectNiveau(btn.dataset.niveau);
  });
});

function initNiveauAvailability() {
  niveauButtons.forEach(btn => {
    const niveau = btn.dataset.niveau;
    const hasSources = (registry[niveau] || []).length > 0;
    btn.disabled = !hasSources;
    if (!hasSources) btn.title = "Aucune source géographique exploitable trouvée pour ce niveau";
  });
}

// ---------- Map / layer handling ----------
function clearMap() {
  if (currentLayer) {
    map.removeLayer(currentLayer);
    currentLayer = null;
  }
  currentSource = null;
  legendContent.innerHTML = "";
  legend.classList.remove("has-items");
}

function updateLegend(source, secteurs) {
  legendContent.innerHTML = "";
  const unique = Array.from(new Set(secteurs)).sort();
  unique.forEach((secteur) => {
    const item = document.createElement("div");
    item.className = "legend-item";
    const swatch = document.createElement("span");
    swatch.className = "legend-swatch";
    swatch.style.background = colorFor(source.id + "::" + secteur);
    item.appendChild(swatch);
    const label = document.createElement("span");
    label.textContent = secteur;
    item.appendChild(label);
    legendContent.appendChild(item);
  });
  legend.classList.toggle("has-items", unique.length > 0);
}

async function loadSourceData(source) {
  if (cache[source.id]) return cache[source.id];
  const res = await fetch(source.url, { headers: { Accept: "application/geo+json, application/json" } });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  cache[source.id] = data;
  return data;
}

async function loadTerritoire(source) {
  clearMap();
  currentSource = source;
  setStatus(`<span class="spinner"></span> Chargement de "${source.label}"…`);

  try {
    const data = await loadSourceData(source);
    if (currentSource !== source) return; // user switched away meanwhile

    const secteurs = [];
    const layer = L.geoJson(data, {
      style: (feature) => {
        const secteur = getField(feature.properties, source.fields.secteur) || "inconnu";
        return { color: "#222222", fillColor: colorFor(source.id + "::" + secteur), fillOpacity: 0.4, weight: 1 };
      },
      onEachFeature: (feature, lyr) => {
        const secteur = getField(feature.properties, source.fields.secteur);
        const etablissement = getField(feature.properties, source.fields.etablissement);
        const label = etablissement || secteur || source.label;
        if (secteur) secteurs.push(secteur);
        lyr.bindTooltip(
          `<div><b>${label}</b>${secteur && secteur !== label ? "<br>Secteur : " + secteur : ""}</div>`,
          { sticky: true }
        );
        const baseStyle = { color: "#222222", fillColor: colorFor(source.id + "::" + (secteur || "inconnu")), fillOpacity: 0.4, weight: 1 };
        lyr.on({
          mouseover: (e) => e.target.setStyle({ fillOpacity: 0.7, weight: 3 }),
          mouseout: (e) => e.target.setStyle(baseStyle),
        });
      },
    });

    layer.addTo(map);
    currentLayer = layer;
    const bounds = layer.getBounds();
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });

    updateLegend(source, secteurs);
    setStatus(`${secteurs.length ? new Set(secteurs).size : layer.getLayers().length} secteur(s) affiché(s) pour "${source.label}".`);
  } catch (err) {
    console.warn(`Source indisponible (${source.label}):`, err);
    setStatus("");
    showToast(`Impossible de charger "${source.label}" : source indisponible.`);
  }
}

// ---------- Legend toggle ----------
legendToggle.addEventListener("click", () => legend.classList.toggle("open"));

// ---------- Mobile bottom sheet ----------
controlsPanel.addEventListener("click", (e) => {
  if (window.innerWidth <= 767 && e.target === controlsPanel) {
    controlsPanel.classList.toggle("expanded");
  }
});
territoireInput.addEventListener("focus", () => {
  if (window.innerWidth <= 767) controlsPanel.classList.add("expanded");
});
// Allow tapping the drag handle area (top padding) to toggle on mobile
controlsPanel.addEventListener("pointerdown", (e) => {
  if (window.innerWidth <= 767 && e.offsetY !== undefined && e.target === controlsPanel) {
    controlsPanel.classList.toggle("expanded");
  }
});

// ---------- Init ----------
async function init() {
  setStatus("Chargement du registre des sources...");
  const res = await fetch("sources.json");
  registry = await res.json();
  initNiveauAvailability();
  selectNiveau("college");
}

init();
</script>
</body>
</html>
