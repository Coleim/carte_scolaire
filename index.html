<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carte scolaire - France</title>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
<style>
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  #map { position: absolute; top: 56px; bottom: 0; right: 0; left: 0; }
  #toolbar {
    position: absolute; top: 0; left: 0; right: 0; height: 56px; z-index: 1000;
    background: #222; color: #fff; display: flex; align-items: center; gap: 1rem;
    padding: 0 1rem; box-sizing: border-box; font-size: 0.95rem;
  }
  #toolbar h1 { font-size: 1rem; margin: 0; font-weight: 600; white-space: nowrap; }
  .niveau-btn {
    background: #444; color: #fff; border: 1px solid #666; border-radius: 4px;
    padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.9rem;
  }
  .niveau-btn.active { background: #2d7dd2; border-color: #2d7dd2; }
  .niveau-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #status { margin-left: auto; font-size: 0.8rem; color: #bbb; max-width: 40%; text-align: right; }
  .leaflet-tooltip { font-size: 0.85rem; }
</style>
</head>
<body>
  <div id="toolbar">
    <h1>Carte scolaire</h1>
    <button class="niveau-btn" data-niveau="ecole">Écoles</button>
    <button class="niveau-btn" data-niveau="college">Collèges</button>
    <button class="niveau-btn" data-niveau="lycee">Lycées</button>
    <div id="status"></div>
  </div>
  <div id="map"></div>

<script>
const palette = ["#bb69ea","#92ea69","#ea8769","#c669ea","#85ea69","#9bea69","#c1ea69",
  "#eab069","#8369ea","#ea696d","#bfea69","#69eaa6","#ea69c1","#69c1ea","#eae069"];

function colorFor(key) {
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  return palette[hash % palette.length];
}

const map = L.map("map", { center: [46.6, 2.5], zoom: 6, zoomControl: true, preferCanvas: true });
L.control.scale().addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", {
  minZoom: 0,
  maxZoom: 19,
  attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors. Tiles: <a href=\"https://www.openstreetmap.fr\">OpenStreetMap France</a>",
  subdomains: "abc",
}).addTo(map);

let registry = null;
let currentNiveau = null;
let currentLayers = [];
const cache = {}; // sourceId -> GeoJSON data

const statusEl = document.getElementById("status");
const buttons = Array.from(document.querySelectorAll(".niveau-btn"));

function setStatus(text) {
  statusEl.textContent = text;
}

function clearLayers() {
  currentLayers.forEach(l => map.removeLayer(l));
  currentLayers = [];
}

function getField(props, fieldName) {
  if (!fieldName) return null;
  return props ? props[fieldName] : null;
}

async function loadSource(source) {
  if (cache[source.id]) return cache[source.id];
  const res = await fetch(source.url, { headers: { Accept: "application/geo+json, application/json" } });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  cache[source.id] = data;
  return data;
}

function addSourceLayer(source, data) {
  const layer = L.geoJson(data, {
    style: (feature) => {
      const secteur = getField(feature.properties, source.fields.secteur) || "inconnu";
      return {
        color: "#333333",
        fillColor: colorFor(source.id + "::" + secteur),
        fillOpacity: 0.38,
        weight: 1,
      };
    },
    onEachFeature: (feature, layer) => {
      const secteur = getField(feature.properties, source.fields.secteur);
      const etablissement = getField(feature.properties, source.fields.etablissement);
      const label = etablissement || secteur || source.label;
      layer.bindTooltip(
        `<div><b>${label}</b><br>${source.label}${secteur && secteur !== label ? "<br>Secteur : " + secteur : ""}</div>`,
        { sticky: true }
      );
      layer.on({
        mouseover: (e) => e.target.setStyle({ fillOpacity: 0.65, weight: 3 }),
        mouseout: (e) => layer.setStyle({
          color: "#333333",
          fillColor: colorFor(source.id + "::" + (secteur || "inconnu")),
          fillOpacity: 0.38,
          weight: 1,
        }),
      });
    },
  });
  layer.addTo(map);
  currentLayers.push(layer);
}

async function showNiveau(niveau) {
  if (!registry) return;
  currentNiveau = niveau;
  buttons.forEach(b => b.classList.toggle("active", b.dataset.niveau === niveau));
  clearLayers();

  const sources = registry[niveau] || [];
  if (sources.length === 0) {
    setStatus(`Aucune source disponible pour "${niveau}".`);
    return;
  }

  setStatus(`Chargement : ${sources.map(s => s.label).join(", ")}...`);
  const failed = [];

  await Promise.all(sources.map(async (source) => {
    try {
      const data = await loadSource(source);
      addSourceLayer(source, data);
    } catch (err) {
      console.warn(`Source indisponible (${source.label}):`, err);
      failed.push(source.label);
    }
  }));

  if (failed.length === 0) {
    setStatus(`${sources.length} territoire(s) chargé(s) pour "${niveau}".`);
  } else {
    setStatus(`${sources.length - failed.length}/${sources.length} territoire(s) chargé(s). Indisponibles : ${failed.join(", ")}.`);
  }
}

function initButtons() {
  buttons.forEach(btn => {
    const niveau = btn.dataset.niveau;
    const hasSources = (registry[niveau] || []).length > 0;
    btn.disabled = !hasSources;
    if (!hasSources) btn.title = "Aucune source géographique exploitable trouvée pour ce niveau";
    btn.addEventListener("click", () => {
      if (!btn.disabled) showNiveau(niveau);
    });
  });
}

async function init() {
  setStatus("Chargement du registre des sources...");
  const res = await fetch("sources.json");
  registry = await res.json();
  initButtons();
  // Default: show collège (most covered level)
  showNiveau("college");
}

init();
</script>
</body>
</html>
